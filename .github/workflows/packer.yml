name: Build CIS Windows Golden Image

on:
  push:
    branches: [ main ]
    paths:
    - 'windows-server.pkr.hcl'
    - 'scripts/**'
    - 'engine/**'
    - 'controls/**'
    - '.github/workflows/packer.yml'
  workflow_dispatch:
    inputs:
      # Only versions whose CIS benchmark is mapped in controls/catalog.json (see "benchmarks")
      os:
        description: "Windows Server version"
        type: choice
        default: ws2022
        options:
          - ws2022
      role:
        description: "Profile: ms = member server image, dc = throwaway domain controller test (no image)"
        type: choice
        default: ms
        options:
          - ms
          - dc
      cis_level:
        description: "CIS level"
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
      vm_size:
        description: "Build VM size"
        type: choice
        default: Standard_DS1_v2
        options:
          - Standard_DS1_v2
          - Standard_DS2_v2

permissions:
  id-token: write
  contents: read

jobs:
  packer-build:
    runs-on: ubuntu-latest
    env:
      # Baseline profile, shared by the Packer build and the evidence steps below.
      # Pushes always build the Server 2022 member server Level 1 image.
      PKR_VAR_os: ${{ inputs.os || 'ws2022' }}
      PKR_VAR_role: ${{ inputs.role || 'ms' }}
      PKR_VAR_cis_level: ${{ inputs.cis_level || '1' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup HashiCorp Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      - name: Initialize Packer Plugins
        run: packer init windows-server.pkr.hcl

      - name: Validate Packer Template
        env:
          PKR_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: packer validate windows-server.pkr.hcl

      - name: Build Hardened Golden Image
        env:
          PKR_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          PKR_VAR_vm_size: ${{ inputs.vm_size || 'Standard_DS1_v2' }}
        # -force replaces the existing managed image; without it every build after the first fails
        run: |
          mkdir -p artifacts
          packer build -force -color=false windows-server.pkr.hcl

      # Evidence steps run even when the build fails, so a failed compliance test is still reported
      - name: Export ATT&CK layer and job summary
        if: always()
        shell: pwsh
        run: |
          Import-Module ./engine/CisBaseline.psm1
          $Catalog  = Get-CisCatalog -Path ./controls/catalog.json
          $Controls = @(Select-CisControl -Catalog $Catalog -Os $env:PKR_VAR_os -Role $env:PKR_VAR_role -Level $env:PKR_VAR_cis_level -Platform azure)
          $ProfileName = "$($env:PKR_VAR_os) $($env:PKR_VAR_role.ToUpper()) L$($env:PKR_VAR_cis_level)"
          Export-AttackLayer -Controls $Controls -Catalog $Catalog -Path ./artifacts/attack-layer.json -Name "CIS baseline $($Catalog.version) $ProfileName coverage"
          $ResultsFile = './artifacts/compliance-results.json'
          $Results = if (Test-Path $ResultsFile) { (Get-Content $ResultsFile -Raw | ConvertFrom-Json).results } else { $null }
          ConvertTo-CisSummaryMarkdown -Results $Results -Controls $Controls -Catalog $Catalog -Os $env:PKR_VAR_os -ProfileName $ProfileName >> $env:GITHUB_STEP_SUMMARY

      - name: Upload compliance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-evidence
          path: artifacts/
          if-no-files-found: warn