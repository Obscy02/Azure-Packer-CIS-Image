name: Build CIS Windows Golden Image

on:
  push:
    branches: [ main ]
    paths:
    - 'windows-server.pkr.hcl'
    - 'scripts/**'
    - 'engine/**'
    - 'controls/**'
    - '.github/workflows/packer.yml'
  workflow_dispatch:
    inputs:
      vm_size:
        description: "Build VM size"
        type: choice
        default: Standard_DS1_v2
        options:
          - Standard_DS1_v2
          - Standard_DS2_v2

permissions:
  id-token: write
  contents: read

jobs:
  packer-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup HashiCorp Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      - name: Initialize Packer Plugins
        run: packer init windows-server.pkr.hcl

      - name: Validate Packer Template
        env:
          PKR_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: packer validate windows-server.pkr.hcl

      - name: Build Hardened Golden Image
        env:
          PKR_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          PKR_VAR_vm_size: ${{ inputs.vm_size || 'Standard_DS1_v2' }}
        # -force replaces the existing managed image; without it every build after the first fails
        run: packer build -force -color=false windows-server.pkr.hcl